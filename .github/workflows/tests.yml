name: META-API Python Tests
on:
  push:
    branches: [integration/meta-api-mcp-v0.1, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src tests
      - run: pytest -q
